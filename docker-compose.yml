services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liveboard
    ports:
      - "5432:5432"
    volumes:
      - liveboard_postgres_data:/var/lib/postgresql/data

volumes:
  liveboard_postgres_data:
